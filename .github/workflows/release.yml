name: Release

# Publishes a GitHub Release when an exact version tag is pushed. Tags are
# cut from `main` after the full CI matrix is green. This workflow re-runs the
# fast quality gates plus one real "install the built ZIP into WordPress"
# acceptance leg, verifies the package version equals the tag, and attaches
# the ZIP + checksum to the Release.
#
# Canonical version source: the `Version:` header and UNIVERSAL_TELEGRAM_VERSION
# constant in universal-telegram.php, plus the `Stable tag` in readme.txt.
# CHANGELOG.md is NOT treated as authoritative here (it currently lags the
# plugin version) and is not gated on — track that separately.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction

      - name: PHPCS
        run: bin/docker/phpcs.sh
      - name: PHPStan
        run: bin/docker/phpstan.sh
      - name: Unit tests (PHP 8.3)
        run: bin/docker/test-unit.sh --php-version=8.3

      - name: Build the release package for the tag version
        run: bin/docker/build-release-package.sh "${GITHUB_REF_NAME#v}"

      - name: Package acceptance — install the built ZIP into real WordPress
        run: bin/docker/test-package.sh --wp-version=7.1 --php-version=8.3

      - name: Verify package version matches the Git tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          zip="dist/universal-telegram-${tag_version}.zip"
          sum="${zip}.sha256"
          [ -s "$zip" ] || { echo "::error::missing $zip for tag ${GITHUB_REF_NAME}"; ls -la dist || true; exit 1; }
          [ -s "$sum" ] || { echo "::error::missing $sum"; exit 1; }
          ( cd dist && sha256sum -c "$(basename "$sum")" )
          header="$(sed -nE 's/^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*([0-9A-Za-z.+-]+).*/\1/p' universal-telegram.php | head -n1)"
          const="$(sed -nE "s/.*UNIVERSAL_TELEGRAM_VERSION',[[:space:]]*'([^']+)'.*/\1/p" universal-telegram.php | head -n1)"
          stable="$(sed -nE 's/^Stable tag:[[:space:]]*([0-9A-Za-z.+-]+).*/\1/p' readme.txt | head -n1)"
          for pair in "header:$header" "UNIVERSAL_TELEGRAM_VERSION:$const" "readme.txt Stable tag:$stable"; do
            name="${pair%%:*}"; val="${pair#*:}"
            [ "$val" = "$tag_version" ] || { echo "::error::${name} ($val) != tag ($tag_version)"; exit 1; }
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/universal-telegram-*.zip
            dist/universal-telegram-*.zip.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      # TODO(private artifact server): a follow-up may add a step here mirroring
      # the ZIP + .sha256 to the internal artifact server, using a dedicated
      # secret (never GITHUB_TOKEN), running only after the Release is created.
      # Endpoint/protocol/secret are not defined for this repo yet.
