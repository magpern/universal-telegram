name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: PHPCS
        run: bin/docker/phpcs.sh

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: PHPStan
        run: bin/docker/phpstan.sh

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Unit tests (PHP ${{ matrix.php-version }})
        run: bin/docker/test-unit.sh --php-version=${{ matrix.php-version }}

  integration-wp-only-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Integration tests (WordPress 6.9, PHP 8.1)
        run: bin/docker/test-integration-wp-only.sh --wp-version=6.9 --php-version=8.1

  integration-wp-only-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Integration tests (WordPress 7.1, PHP 8.3)
        run: bin/docker/test-integration-wp-only.sh --wp-version=7.1 --php-version=8.3

  integration-wc-present-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bin/docker/composer.sh install --no-interaction
      - name: Integration tests (WordPress 7.1, WooCommerce 11.0.1)
        run: bin/docker/test-integration-wc-present.sh --wp-version=7.1 --wc-version=11.0.1

  package:
    name: Release package (build validation, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the release package (Docker php service)
        run: bin/docker/build-release-package.sh
      - name: Inspect the artifact
        run: |
          set -euo pipefail
          zip="$(ls dist/universal-telegram-*.zip)"
          sum="$(ls dist/universal-telegram-*.zip.sha256)"
          test -s "$zip"
          test -s "$sum"
          echo "== ZIP contents =="
          unzip -l "$zip"
          ( cd dist && sha256sum -c "$(basename "$sum")" )
          names="$(unzip -Z1 "$zip")"
          test "$(printf '%s\n' "$names" | cut -d/ -f1 | sort -u)" = "universal-telegram"
          printf '%s\n' "$names" | grep -qx 'universal-telegram/universal-telegram.php'
          printf '%s\n' "$names" | grep -qx 'universal-telegram/vendor/autoload.php'
          printf '%s\n' "$names" | grep -qx 'universal-telegram/vendor/woocommerce/action-scheduler/action-scheduler.php'
          ! printf '%s\n' "$names" | grep -qE '/(\.git|\.github|\.claude|tests|docs|docker|bin|scripts)/'

  package-acceptance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - wp-version: '6.9'
            php-version: '8.1'
            woocommerce: ''
          - wp-version: '7.1'
            php-version: '8.3'
            woocommerce: ''
          - wp-version: '7.1'
            php-version: '8.3'
            woocommerce: '11.0.1'
    steps:
      - uses: actions/checkout@v7
      - name: Package acceptance (WordPress ${{ matrix.wp-version }}, PHP ${{ matrix.php-version }}${{ matrix.woocommerce && format(', WooCommerce {0}', matrix.woocommerce) }})
        run: |
          if [ -n "${{ matrix.woocommerce }}" ]; then
            bin/docker/test-package.sh --wp-version=${{ matrix.wp-version }} --php-version=${{ matrix.php-version }} --woocommerce=${{ matrix.woocommerce }}
          else
            bin/docker/test-package.sh --wp-version=${{ matrix.wp-version }} --php-version=${{ matrix.php-version }}
          fi
